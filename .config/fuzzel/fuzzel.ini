[main]
font=UbuntuMono Nerd Font:size=12
prompt="󰍉 "
icon-theme=Papirus-Dark
fields=name,generic,comment,categories
terminal=alcritty
lines=10
width=50
horizontal-pad=20
vertical-pad=10
inner-pad=5

[colors]
# Background: Charcoal (#2d2a2e) with 95% opacity (f2)
background=2d2a2ef2
# Text: Off-white (#fcfcfa)
text=fcfcfaff
# Input/Prompt: Monokai Yellow (#ffd866)
prompt=ffd866ff
# Match color: Monokai Pink (#ff6188)
match=ff6188ff
# Selection background: Lighter Charcoal (#403e41)
selection=403e41ff
# Selection text: Monokai Green (#a9dc76)
selection-text=a9dc76ff
# Selection match: Monokai Pink (#ff6188)
selection-match=ff6188ff
# Border: Monokai Yellow (#ffd866)
border=ffd866ff

[border]
width=2
radius=0
