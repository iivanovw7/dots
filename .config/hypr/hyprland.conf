# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf
source = ~/.config/hypr/monitors.conf

################
### MONITORS ###
################

$laptop = eDP-1
$monitor1 = DVI-I-1
$monitor2 = DVI-I-2

monitor = $laptop, 1920x1080, 0x0, 1

###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = ghostty
$fileManager = nemo
$menu = hyprlauncher

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = swaybg -m fill -i $HOME/Backgrounds/desktop.png
exec-once = wl-clip-persist --clipboard regular
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = mako
exec-once = ~/.config/waybar/launch.sh
exec-once = hypridle
exec-once = xrdb -merge ~/.Xresources
exec-once = systemctl --user start hyprpolkitagent

exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Dracula'
exec-once = gsettings set org.gnome.desktop.interface icon-theme 'Dracula'
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Captaine Cursors - White'

cursor {
    no_hardware_cursors = true
}

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Capitaine Cursors - White
env = GTK_THEME,monokai-gtk
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1

env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

env = GHOSTTY_WAYLAND_DISPLAY,wayland-0
env = WLC_REPEAT_RATE,50

###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#    enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

$bg      = rgba(2d2a2eff)
$bg_alt  = rgba(403e41ff)
$fg      = rgba(fcfcfaff)
$yellow  = rgba(ffd866ee)
$pink    = rgba(ff6188ee)
$green   = rgba(a9dc76ee)
$purple  = rgba(ab9df2ee)

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 4
    gaps_out = 6

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = $yellow
    col.inactive_border = $bg_alt

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

group {
    col.border_active = $yellow
    col.border_inactive = rgba(403e41ff)
    col.border_locked_active = $yellow
    col.border_locked_inactive = rgba(403e41ff)

    groupbar {
        enabled = true
        font_size = 12
        font_family = sans-serif
        height = 22
        gradients = false
        render_titles = true
        col.active = $yellow
        col.inactive = rgba(403e41ff)
        text_color = $yellow
        text_color_inactive = rgba(fcfcfaff)
    }
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 0
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #         NAME,            X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #             NAME,           ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,        popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,        fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule {
#     name = no-gaps-wtv1
#     match:float = false
#     match:workspace = w[tv1]
#
#     border_size = 0
#     rounding = 0
# }
#
# windowrule {
#     name = no-gaps-f1
#     match:float = false
#     match:workspace = f[1]
#
#     border_size = 0
#     rounding = 0
# }

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    # pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us,ru
    kb_variant =
    kb_model =
    kb_rules =
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod, RETURN, exec, $terminal # Open terminal
bind = $mainMod, E, exec, $fileManager # Open file manager tool
bind = $mainMod, V, togglefloating # Toggle floating layout
bind = $mainMod, R, exec, killall -SIGUSR2 waybar # Reload waybar
bind = $mainMod, P, pseudo # Toggle pseudotile mode
bind = $mainMod, TAB, layoutmsg, togglesplit # Togglesplit, toggle window split
bind = $mainMod, F, togglefloating # Toggle window float
bind = $mainMod, F, fullscreen, 0 # Toggle fullscreen
bind = $mainMod, G, togglegroup # Toggle group

binde = ALT, h, moveactive, -40 0 # Move active window left
binde = ALT, l, moveactive, 40 0 # Move active window right
binde = ALT, k, moveactive, 0 -40 # Move active window up
binde = ALT, j, moveactive, 0 40 # Move active window down

bind = $mainMod SHIFT, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit # Exit session
bind = $mainMod SHIFT, R, exec, export HYPRLAND_INSTANCE_SIGNATURE=$(ls -t /run/user/$(id -u)/hypr/ | head -n 1); hyprctl reload; killall waybar; waybar & disown, reload hyprland # Reload hyprland and waybar
bind = $mainMod SHIFT, C, killactive # Kill active window
bind = $mainMod SHIFT, RETURN, exec, fuzzel # Open application launcher
bind = $mainMod SHIFT, Q, exec, ~/.local/scripts/fuzzel-powermenu
bind = $mainMod SHIFT, I, exec, ~/.local/scripts/input-switch # Switch audio input device
bind = $mainMod SHIFT, O, exec, ~/.local/scripts/output-switch # Switch audio output device
bind = $mainMod SHIFT, X, exec, ghostty --title='hyprmoncfg-float' -e hyprmoncfg # Open monitors config

bind = $mainMod, A, exec, ghostty --title='wiremix-float' -e wiremix # Open audio config
bind = $mainMod, Escape, exec, ghostty --title='btop-float' -e bpytop # Open system monitor

bind = $mainMod, B, exec, pkill waybar || waybar # Toggle show/hide toolbars
bind = $mainMod, T, exec, ~/.local/scripts/fuzzel-keybindings # Open keybindings list

bind = $mainMod CONTROL, S, exec, bash -c 'grim -g "$(slurp)" - | satty -f - --copy-command wl-copy' # screenshot with select region
bind = $mainMod CONTROL, A, exec, bash -c 'grim -t png - | satty --filename - --copy-command wl-copy' # screenshot all monitors

bind = $mainMod, left, movefocus, l # Move focus left
bind = $mainMod, right, movefocus, r # Move focus right
bind = $mainMod, up, movefocus, u # Move focus up
bind = $mainMod, down, movefocus, d # Move focus down

bind = $mainMod, h, movefocus, l # Move focus left
bind = $mainMod, l, movefocus, r # Move focus right
bind = $mainMod, k, movefocus, u # Move focus up
bind = $mainMod, j, movefocus, d # Move focus down

bind = $mainMod SHIFT, h, movewindow, l # Move window left
bind = $mainMod SHIFT, l, movewindow, r # Move window right
bind = $mainMod SHIFT, k, movewindow, u # Move window up
bind = $mainMod SHIFT, j, movewindow, d # Move window down

bind = $mainMod SHIFT CONTROL, h, changegroupactive, f
bind = $mainMod SHIFT CONTROL, l, changegroupactive, b

binde = $mainMod CONTROL, h, resizeactive, -30 0 # Resize window left
binde = $mainMod CONTROL, l, resizeactive, 30 0 # Resize window right
binde = $mainMod CONTROL, k, resizeactive, 0 -30 # Resize window up
binde = $mainMod CONTROL, j, resizeactive, 0 30 # Resize window down

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1 # Workspace 1
bind = $mainMod, 2, workspace, 2 # Workspace 2
bind = $mainMod, 3, workspace, 3 # Workspace 3
bind = $mainMod, 4, workspace, 4 # Workspace 4
bind = $mainMod, 5, workspace, 5 # Workspace 5
bind = $mainMod, 6, workspace, 6 # Workspace 6
bind = $mainMod, 7, workspace, 7 # Workspace 7
bind = $mainMod, 8, workspace, 8 # Workspace 8
bind = $mainMod, 9, workspace, 9 # Workspace 9
bind = $mainMod, 0, workspace, 10 # Workspace 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1 # Move window to workspace 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2 # Move window to workspace 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3 # Move window to workspace 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4 # Move window to workspace 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5 # Move window to workspace 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6 # Move window to workspace 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7 # Move window to workspace 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8 # Move window to workspace 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9 # Move window to workspace 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10 # Move window to workspace 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic # Toggle special workspace
bind = $mainMod SHIFT, S, movetoworkspace, special:magic # Move window to special workspace

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1 # Scroll down through workspaces
bind = $mainMod, mouse_up, workspace, e-1 # Scroll up through workspaces

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow # Move or resize window with mouse
bindm = $mainMod, mouse:273, resizewindow # Move or resize window with mouse

bind = $mainMod, period, focusmonitor, +1 # Focus next monitor
bind = $mainMod, comma, focusmonitor, -1 # Focus previous monitor

bindl=,switch:off:Lid Switch,exec,hyprctl keyword monitor "eDP-1, preferred, auto, 1"
bindl=,switch:on:Lid Switch,exec,hyprctl keyword monitor "eDP-1, disable"

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ # Raise volume
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- # Lower volume
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle # Toggle mute
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle # Toggle microphone mute
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+ # Raise brightness
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%- # Lower brightness

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next # Play next
bindl = , XF86AudioPause, exec, playerctl play-pause # Play
bindl = , XF86AudioPlay, exec, playerctl play-pause # Pause
bindl = , XF86AudioPrev, exec, playerctl previous # Play pprevious

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}


xwayland {
    force_zero_scaling = true
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

windowrule = border_color rgb(ff6188), match:float yes
windowrule = opacity 0.95, match:float yes

windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = pin on, match:title ^(Picture-in-Picture)$
windowrule = float on, match:class ^(zen)$, match:title ^(Picture-in-Picture)$
windowrule = pin on, match:class ^(zen)$, match:title ^(Picture-in-Picture)$

windowrule = float on, match:title ^(hyprmoncfg-float)$
windowrule = size 1200 900, match:title ^(hyprmoncfg-float)$
windowrule = center on, match:title ^(hyprmoncfg-float)$

windowrule = float on, match:title ^(wiremix-float)$
windowrule = size 900 600, match:title ^(wiremix-float)$
windowrule = center on, match:title ^(wiremix-float)$

windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = size 600 400, match:class ^(nm-connection-editor)$
windowrule = center on, match:class ^(nm-connection-editor)$

windowrule = float on, match:title ^(Volume Control)$
windowrule = size 900 700, match:title ^(Volume Control)$
windowrule = center on, match:title ^(Volume Control)$

windowrule = float on, match:class ^(com.saivert.pwvucontrol)$
windowrule = size 900 700, match:class ^(com.saivert.pwvucontrol)$
windowrule = center on, match:class ^(com.saivert.pwvucontrol)$

windowrule = float on, match:class ^(blueman-manager)$
windowrule = size 900 700, match:class ^(blueman-manager)$
windowrule = center on, match:class ^(blueman-manager)$

windowrule = float on, match:class ^(eww-dashboard)$
windowrule = pin on, match:class ^(eww-dashboard)$

windowrule = float on, match:title ^(btop-float)$
windowrule = center on, match:title ^(btop-float)$
windowrule = size 1200 900, match:title ^(btop-float)$

windowrule = workspace 2, match:class ^(org.telegram.desktop)$
windowrule = workspace 5, match:class ^(steam)$
windowrule = workspace 6, match:class ^(chromium)$
windowrule = workspace 7, match:class ^(zen)$

decoration {
   blur {
      enabled = true
      ignore_opacity = true
   }
}


layerrule {
    name = rofi-blur
    match:namespace = ^(fuzzel)$
    blur = on
    ignore_alpha = 0.1
}

workspace = 1, monitor:$monitor1, default:true
workspace = 2, monitor:$monitor1
workspace = 3, monitor:$monitor1
workspace = 4, monitor:$monitor1
workspace = 5, monitor:$monitor1,

workspace = 6, monitor:$monitor2, default:true
workspace = 7, monitor:$monitor2
workspace = 8, monitor:$monitor2
workspace = 9, monitor:$monitor2
workspace = 10, monitor:$monitor2
